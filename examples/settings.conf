# Copy to ~/.config/bpd-backup/settings.conf and change what you need.
# Every line is optional; the values shown are the defaults.

# Where things live
state_dir  = ~/.local/state/bpd-backup
cache_dir  = ~/.cache/bpd-backup
local_root = ~/backups
drive_root = /my-files
menu_file  = ~/.local/share/kio/servicemenus/bpd-send.desktop

# Defaults for any set that does not say otherwise
default_stale_days = 2
default_keep       = 7 4 6 1
default_keep_local = 3

# Desktop notifications from every bpd-* script: yes or no.
# bpd-check still prints its warnings in the terminal either way.
notifications = yes

# Archives
zstd_level = 3
log_max_kb = 1024

# bpd-prune: most archives one run may trash
prune_max = 30

# bpd-drill: days between test restores (0 = never remind), and which archive
# a drill takes: oldest (most likely to have gone bad unnoticed) or newest
drill_days       = 30
drill_pick       = oldest
drill_sample     = 5
drill_confirm_mb = 1024
drill_spare_mb   = 256

# Dolphin menu: auto uses the KDE plugin when it is installed, else a flat menu
menu_mode      = auto
menu_depth     = 3
menu_max       = 200
menu_per_level = 60

# bpd-mirror: bpd-check warns after this many days without a good mirror run
mirror_stale_days = 7

# bpd-send when the name is already taken on Drive: skip or replace
send_conflict = skip

# Timeouts (s, m, h or d)
probe_timeout = 30
list_timeout  = 120
call_timeout  = 60
push_timeout  = 3h
send_timeout  = 1h
drill_timeout = 4h
before_timeout = 4h
