# Photos pulled from an Android phone over adb, when one is plugged in.
# The before = command fills the source folder. Exit 3 means "no phone,
# nothing to do", so an hourly timer is quiet until the phone is attached.
before = adb get-state >/dev/null 2>&1 || exit 3; adb pull -a /sdcard/DCIM "$BPD_SOURCE/"
source = ~/phone-mirror
only_on_change = yes

drive      = /my-files/backups/phone
recipients = ~/.config/bpd-backup/phone.pub
identity   = ~/.config/bpd-backup/phone.key
stale_days = 14
keep       = 4 3 4 1
keep_local = 2
