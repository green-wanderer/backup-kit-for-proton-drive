# A large folder that rarely changes, on an external drive. Archived only when
# something in it changed, never encrypted, and copied to a second disk by
# bpd-mirror. An empty source (the drive not mounted) is refused, never archived.
source         = /media/external/library
only_on_change = yes
drive          = /my-files/backups/library
stale_days     = 30
keep           = 4 4 12 10

# A second copy on another disk. Run bpd-mirror --init /mnt/backup-disk once.
mirror = /mnt/backup-disk/bpd-backup/library
