# A database set. bpd-backup archives folders, so dump into one first:
# the comment in examples/systemd/bpd-backup@.service shows how.
source     = ~/dumps/postgres
drive      = /my-files/backups/postgres
recipients = ~/.config/bpd-backup/postgres.pub
identity   = ~/.config/bpd-backup/postgres.key
stale_days = 2
keep       = 14 8 12 5
keep_local = 7
