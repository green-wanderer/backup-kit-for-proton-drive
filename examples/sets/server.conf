# A server that makes its own encrypted archive each night. before = fetches
# it; mode = file takes the newest match as this run's archive, as is, and a
# file that has not changed since the last run is not taken twice.
before = rsync -a --timeout=600 backup@server.example:/var/backups/ "$PD_SOURCE/"
source = ~/server-pull
mode   = file
match  = *.tar.gz.age

drive    = /my-files/backups/server
identity = ~/.config/pd-backup/server.key
keep     = 7 4 6 2
