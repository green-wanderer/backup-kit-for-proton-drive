# One file per backup set; the file name (home) is the set name.
# Copy to ~/.config/pd-backup/sets/ and edit.

# What to archive, and what to leave out (tar --exclude patterns).
source  = ~
exclude = ./.cache
exclude = ./.local/share/Trash
exclude = ./Downloads
exclude = ./.local/state/pd-backup

# Where the archives go on Drive (default /my-files/backups/SET) and where the
# local copies are kept (default ~/backups/SET). A local folder inside source
# is left out automatically.
drive = /my-files/backups/home
local = ~/backups/home

# age keys. recipients (public) encrypts every archive; identity (private) is
# only needed by pd-drill and for a real restore. Keep a copy of the identity
# somewhere that is not this machine, or the backups cannot be opened.
# Leave both out to upload unencrypted archives.
recipients = ~/.config/pd-backup/home.pub
identity   = ~/.config/pd-backup/home.key

# Checked against the archive's file list. A forbid = match stops the run
# before anything is uploaded; pd-drill checks both again on restore.
# Each is a plain piece of text matched anywhere in a path. Private keys named
# by any set's identity = are left out and forbidden automatically.
# forbid = .password-store/
require = ./.bashrc

# pd-check warns when the newest archive is this many days old.
stale_days = 2

# Retention on Drive: daily weekly monthly yearly (see pd-prune -h).
keep = 7 4 6 1

# How many archives to keep locally.
keep_local = 3
