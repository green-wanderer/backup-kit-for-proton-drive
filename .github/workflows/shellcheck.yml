# Lints every shell script on each push and pull request; the README badge shows the result.
name: shellcheck

on:
  push:
    # Branches only. A release pushes its tag too, the same code; naming only branches
    # leaves tags out. (Naming only tags-ignore left branches out too: it never ran.)
    branches: ['**']
  pull_request:
  # A "Run workflow" button on the Actions page, to check by hand without a push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck bin/* install.sh lib/common.sh
